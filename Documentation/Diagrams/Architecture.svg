<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 460" role="img" aria-labelledby="arch-title arch-desc"><style>:root{--ink:#152d24;--muted:#42584f;--accent:#176a50;--rule:#c8d9d0;--tint:#edf5ef;--paper:#fcfdfb;--white:#fff;}
svg text { fill: var(--ink); font: 13px "Segoe UI", system-ui, sans-serif; }
svg .strong { font-weight: 700; }
svg .small { font-size: 11px; fill: var(--muted); }
svg .node { fill: var(--white); stroke: var(--rule); stroke-width: 1.3; }
svg .focus { fill: var(--tint); stroke: var(--accent); stroke-width: 1.3; }
svg .boundary { fill: var(--paper); stroke: var(--rule); stroke-dasharray: 6, 4; }
svg .edge { fill: none; stroke: var(--muted); stroke-width: 1.4; }
svg .dash { stroke-dasharray: 5, 4; }</style><rect width="100%" height="100%" fill="#ffffff"/>
            <title id="arch-title">EcoShift architecture with frontend, shared platform, and five proposed business services</title>
            <desc id="arch-desc">The frontend authenticates with Keycloak and calls Spring Cloud Gateway. Gateway routes to the five Spring Boot services, each with its own database. Gateway and services discover through Eureka and load configuration from Config Server. RabbitMQ carries business events within Docker Compose.</desc>

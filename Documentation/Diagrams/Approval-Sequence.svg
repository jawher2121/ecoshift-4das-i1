<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 227" role="img" aria-labelledby="approve-title approve-desc"><style>:root{--ink:#152d24;--muted:#42584f;--accent:#176a50;--rule:#c8d9d0;--tint:#edf5ef;--paper:#fcfdfb;--white:#fff;}
svg text { fill: var(--ink); font: 13px "Segoe UI", system-ui, sans-serif; }
svg .strong { font-weight: 700; }
svg .small { font-size: 11px; fill: var(--muted); }
svg .node { fill: var(--white); stroke: var(--rule); stroke-width: 1.3; }
svg .focus { fill: var(--tint); stroke: var(--accent); stroke-width: 1.3; }
svg .boundary { fill: var(--paper); stroke: var(--rule); stroke-dasharray: 6, 4; }
svg .edge { fill: none; stroke: var(--muted); stroke-width: 1.4; }
svg .dash { stroke-dasharray: 5, 4; }</style><rect width="100%" height="100%" fill="#ffffff"/>
            <title id="approve-title">Sequence for approving a reservation</title>
            <desc id="approve-desc">From top to bottom, the coordinator posts an approval through Gateway, Event Requests calls Stock and Reservations synchronously, Stock returns a reservation or conflict, and Event Requests responds through Gateway.</desc>
            <defs><marker id="seq-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--muted)"/></marker></defs>
            <g text-anchor="middle">
              <rect class="node" x="55" y="12" width="180" height="32" rx="6"/><text class="strong" x="145" y="32">Coordinator</text>
              <rect class="node" x="270" y="12" width="180" height="32" rx="6"/><text class="strong" x="360" y="32">Gateway</text>
              <rect class="node" x="485" y="12" width="180" height="32" rx="6"/><text class="strong" x="575" y="32">Event Requests</text>
              <rect class="focus" x="700" y="12" width="180" height="32" rx="6"/><text class="strong" x="790" y="32">Stock and Reservations</text>
              <path class="edge dash" d="M145 44V218M360 44V218M575 44V218M790 44V218"/>
              <g class="edge" marker-end="url(#seq-arrow)"><path d="M145 76H360"/><path d="M360 104H575"/><path d="M575 132H790"/></g>
              <g class="edge dash" marker-end="url(#seq-arrow)"><path d="M790 159H575"/><path d="M575 186H360"/><path d="M360 212H145"/></g>
              <text class="small" x="252" y="69">POST approval</text>
              <text class="small" x="468" y="97">Route request</text>
              <text class="small" x="682" y="125">PUT reservation via OpenFeign</text>
              <text class="small" x="682" y="152">Reservation or capacity conflict</text>
              <text class="small" x="468" y="179">Approval or conflict</text>
              <text class="small" x="252" y="205">200 or 409</text>
            </g>
          </svg>
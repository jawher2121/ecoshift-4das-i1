<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 222" role="img" aria-labelledby="use-title use-desc"><style>:root{--ink:#152d24;--muted:#42584f;--accent:#176a50;--rule:#c8d9d0;--tint:#edf5ef;--paper:#fcfdfb;--white:#fff;}
svg text { fill: var(--ink); font: 13px "Segoe UI", system-ui, sans-serif; }
svg .strong { font-weight: 700; }
svg .small { font-size: 11px; fill: var(--muted); }
svg .node { fill: var(--white); stroke: var(--rule); stroke-width: 1.3; }
svg .focus { fill: var(--tint); stroke: var(--accent); stroke-width: 1.3; }
svg .boundary { fill: var(--paper); stroke: var(--rule); stroke-dasharray: 6, 4; }
svg .edge { fill: none; stroke: var(--muted); stroke-width: 1.4; }
svg .dash { stroke-dasharray: 5, 4; }</style><rect width="100%" height="100%" fill="#ffffff"/>
            <title id="use-title">EcoShift use-case diagram</title>
            <desc id="use-desc">Club organizers submit, view, and cancel their requests. Campus coordinators review and decide requests and view shortage forecasts. Stockroom staff issue loans, reconcile returns, and resolve recovery tasks.</desc>
            <rect class="boundary" x="260" y="14" width="665" height="193" rx="8"/>
            <text class="small strong" x="279" y="34">ECOSHIFT</text>
            <g text-anchor="middle">
              <rect class="node" x="27" y="45" width="190" height="35" rx="6"/><text class="strong" x="122" y="67">Club organizer</text>
              <rect class="node" x="27" y="100" width="190" height="35" rx="6"/><text class="strong" x="122" y="122">Campus coordinator</text>
              <rect class="node" x="27" y="155" width="190" height="35" rx="6"/><text class="strong" x="122" y="177">Stockroom staff</text>
              <path class="edge" d="M217 62.5H298M217 117.5H298M217 172.5H298"/>
              <rect class="focus" x="298" y="45" width="593" height="35" rx="17"/><text x="595" y="67">Submit, view, and cancel own requests before pickup</text>
              <rect class="focus" x="298" y="100" width="593" height="35" rx="17"/><text x="595" y="122">Review requests, approve or reject, and inspect shortage forecasts</text>
              <rect class="focus" x="298" y="155" width="593" height="35" rx="17"/><text x="595" y="177">Issue loans, reconcile returns, and resolve recovery work</text>
            </g>
          </svg>
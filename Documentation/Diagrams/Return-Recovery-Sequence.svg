<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 240" role="img" aria-labelledby="return-title return-desc"><defs><marker id="seq-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#42584f"/></marker></defs><style>:root{--ink:#152d24;--muted:#42584f;--accent:#176a50;--rule:#c8d9d0;--tint:#edf5ef;--paper:#fcfdfb;--white:#fff;}
svg text { fill: var(--ink); font: 13px "Segoe UI", system-ui, sans-serif; }
svg .strong { font-weight: 700; }
svg .small { font-size: 11px; fill: var(--muted); }
svg .node { fill: var(--white); stroke: var(--rule); stroke-width: 1.3; }
svg .focus { fill: var(--tint); stroke: var(--accent); stroke-width: 1.3; }
svg .boundary { fill: var(--paper); stroke: var(--rule); stroke-dasharray: 6, 4; }
svg .edge { fill: none; stroke: var(--muted); stroke-width: 1.4; }
svg .dash { stroke-dasharray: 5, 4; }</style><rect width="100%" height="100%" fill="#ffffff"/>
            <title id="return-title">Sequence for asynchronous return and clearance</title>
            <desc id="return-desc">Kit Circulation sends ReturnRecorded through RabbitMQ to Stock, Stock sends ReturnStockHeld to Kit Recovery, Kit Recovery sends RecoveryResolved to Stock, and Stock publishes snapshots to Capacity Planner.</desc>
            <g text-anchor="middle">
              <rect class="node" x="20" y="12" width="155" height="32" rx="6"/><text class="strong" x="97.5" y="32">Kit Circulation</text>
              <rect class="node" x="205" y="12" width="155" height="32" rx="6"/><text class="strong" x="282.5" y="32">RabbitMQ</text>
              <rect class="focus" x="390" y="12" width="170" height="32" rx="6"/><text class="strong" x="475" y="32">Stock and Reservations</text>
              <rect class="node" x="590" y="12" width="155" height="32" rx="6"/><text class="strong" x="667.5" y="32">Kit Recovery</text>
              <rect class="node" x="775" y="12" width="155" height="32" rx="6"/><text class="strong" x="852.5" y="32">Capacity Planner</text>
              <path class="edge dash" d="M97.5 44V231M282.5 44V231M475 44V231M667.5 44V231M852.5 44V231"/>
              <g class="edge" marker-end="url(#seq-arrow)">
                <path d="M97.5 77H282.5"/><path d="M282.5 94H475"/>
                <path d="M475 120H282.5"/><path d="M282.5 137H667.5"/>
                <path d="M667.5 163H282.5"/><path d="M282.5 180H475"/>
                <path d="M475 205H282.5"/><path d="M282.5 222H852.5"/>
              </g>
              <text class="small" x="190" y="70">ReturnRecorded</text>
              <text class="small" x="379" y="113">ReturnStockHeld</text>
              <text class="small" x="572" y="156">RecoveryResolved</text>
              <text class="small" x="379" y="198">StockProjectionChanged</text>
            </g>
          </svg>